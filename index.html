<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<title>PLAN DE DIEU CENTER — Rapò Finansye</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#163F9E">
<style>
:root{--bl:#163F9E;--ro:#2F5FD0;--go:#FFC000;--lg:#FFF4CC;--lb:#E8EEFB;--bg:#fff;--tx:#14213d;--rd:#C00000;--gr:#0B7A3B;--bd:#C5D1F0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1730;--tx:#eef2ff;--lg:#3a3210;--lb:#1b2750;--bd:#34457f;--rd:#ff7b7b;--gr:#5fd68f}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;max-width:640px;margin:0 auto;padding-bottom:84px}
header{background:var(--bl);text-align:center;padding:14px 10px 0}
header h1{margin:0;color:#fff;font-size:20px;letter-spacing:.5px}
header h2{margin:2px 0 8px;color:var(--go);font-size:17px}
.slogan{background:var(--go);color:var(--bl);font-weight:700;font-size:13px;padding:6px}
main{padding:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;max-width:640px;margin:0 auto;background:var(--bl);padding-bottom:env(safe-area-inset-bottom,0px);border-top:3px solid var(--go)}
nav button{flex:1;border:0;background:none;color:#cfd9f7;font-size:13px;font-weight:700;padding:12px 4px}
nav button.on{color:var(--go)}
.card{background:var(--lb);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:700;margin:8px 0 3px;color:var(--ro)}
input{width:100%;font-size:18px;padding:11px;border:2px solid var(--bd);border-radius:10px;background:var(--lg);color:var(--tx)}
.net{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:700}
.btn{border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:700;width:100%;margin-top:10px;background:var(--bl);color:#fff}
.btn.g{background:var(--go);color:var(--bl)}.btn.s{background:none;border:2px solid var(--bl);color:var(--tx)}
.pos{color:var(--gr)}.neg{color:var(--rd)}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid var(--bd)}
.row small{opacity:.75;display:block}.row b{font-size:17px}
.kp{display:flex;justify-content:space-between;align-items:center;background:var(--bl);color:#fff;border-radius:10px;margin-bottom:8px;padding:12px;font-weight:700;font-size:13px}
.kp span{background:var(--lg);color:var(--bl);border-radius:8px;padding:6px 10px;font-size:16px}
.kp.big{background:var(--ro)}.kp.big span{background:var(--go)}
.kp span.neg{color:var(--rd)}
h3{color:var(--ro);margin:6px 0}
select{font-size:16px;padding:8px;border-radius:8px;border:2px solid var(--bd);background:var(--lg);color:var(--tx)}
.hide{display:none}
.hint{font-size:12px;opacity:.8;text-align:center;margin-top:8px}
</style>
</head>
<body>
<header><h1>RAPPORT FINANCIER</h1><h2>PLAN DE DIEU CENTER</h2></header>
<div class="slogan" style="text-align:center">DÒMI PÒV LEVE RICH!</div>
<main>
<section id="p1">
 <div class="card">
  <h3 id="ft">Nouvo antre</h3>
  <label>Dat</label><input type="date" id="d">
  <label>Gain / Pèt (Gdes) — pèt = siy moins</label><input type="number" inputmode="decimal" id="g" placeholder="0">
  <label>Reparasyon (Gdes)</label><input type="number" inputmode="decimal" id="r" placeholder="0">
  <div class="net"><span>Gain net / Pèt net</span><span id="nv">0.00</span></div>
  <button class="btn" id="sv">Anrejistre</button>
  <button class="btn s hide" id="cn">Anile modifikasyon</button>
 </div>
 <div class="card"><h3>Antre yo</h3><div id="ls"></div></div>
</section>
<section id="p2" class="hide">
 <div class="card"><h3>Bilan chak mwa</h3><div id="ms"></div></div>
</section>
<section id="p3" class="hide">
 <div id="kp"></div>
 <div class="card"><h3>Evolisyon chak mwa</h3>Ane: <select id="yr"></select><div id="ch" style="margin-top:10px"></div></div>
 <button class="btn g" id="ex">Telechaje kopi (CSV pou Excel)</button>
 <button class="btn s" id="im">Mete yon kopi CSV ankò</button>
 <input type="file" id="fi" accept=".csv,text/csv" class="hide">
 <p class="hint">Done yo rete nan telefòn sa a (navigatè a). Fè yon kopi souvan pou ou pa pèdi yo.</p>
</section>
</main>
<nav><button data-p="p1" class="on">Antre</button><button data-p="p2">Mwa</button><button data-p="p3">Tablo de bò</button></nav>
<script>
const K="pdc_entries_v1";
let E=[],edit=null;
const $=i=>document.getElementById(i);
try{E=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){E=[]}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(E))}catch(e){alert("Pa kapab sove done yo.")}};
const n=v=>v===""||v==null||isNaN(+v)?0:+v;
const f=v=>v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=v=>v<0?"neg":v>0?"pos":"";
const MO=["Janvye","Fevriye","Mas","Avril","Me","Jen","Jiyè","Out","Septanm","Oktòb","Novanm","Desanm"];
const today=()=>{const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const fd=s=>s.split("-").reverse().join("/");
const net=e=>e.g-e.r;
function prev(){const v=n($("g").value)-n($("r").value);$("nv").textContent=f(v)+" Gdes";$("nv").className=cls(v)}
function reset(){edit=null;$("d").value=today();$("g").value="";$("r").value="";$("ft").textContent="Nouvo antre";$("sv").textContent="Anrejistre";$("cn").classList.add("hide");prev()}
$("g").oninput=$("r").oninput=prev;
$("sv").onclick=()=>{
 const d=$("d").value;if(!d){alert("Mete yon dat.");return}
 const o={d,g:n($("g").value),r:n($("r").value)};
 if(edit){const i=E.findIndex(x=>x.id===edit);E[i]={...E[i],...o}}else E.push({id:Date.now()+Math.random(),...o});
 save();reset();render()};
$("cn").onclick=reset;
function render(){
 const S=[...E].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.id-b.id);
 let c=0;const bal={};S.forEach(e=>{c+=net(e);bal[e.id]=c});
 $("ls").innerHTML=S.length?[...S].reverse().map(e=>`<div class="row"><div><b>${fd(e.d)}</b><small>Gain/Pèt ${f(e.g)} · Repa. ${f(e.r)}</small><small>Montan an: ${f(bal[e.id])} Gdes</small></div><div style="text-align:right"><b class="${cls(net(e))}">${f(net(e))}</b><br><a href="#" data-e="${e.id}">Modifye</a> · <a href="#" data-x="${e.id}">Efase</a></div></div>`).join(""):"<p>Pa gen antre ankò.</p>";
 $("ls").querySelectorAll("a").forEach(a=>a.onclick=ev=>{ev.preventDefault();
  if(a.dataset.e){const e=E.find(x=>String(x.id)===a.dataset.e);edit=e.id;$("d").value=e.d;$("g").value=e.g;$("r").value=e.r;$("ft").textContent="Modifye antre a";$("sv").textContent="Sove modifikasyon";$("cn").classList.remove("hide");prev();scrollTo(0,0)}
  else if(confirm("Efase antre sa a?")){E=E.filter(x=>String(x.id)!==a.dataset.x);save();render()}});
 // monthly
 const M={};E.forEach(e=>{const k=e.d.slice(0,7);const m=M[k]||(M[k]={g:0,r:0,b:0,p:0});const v=net(e);m.g+=e.g>0?e.g:0;m.r+=e.r;if(v>0)m.b+=v;else m.p-=v});
 const ks=Object.keys(M).sort().reverse();
 $("ms").innerHTML=ks.length?ks.map(k=>{const m=M[k],bl=m.b-m.p;return `<div class="row"><div><b>${MO[+k.slice(5)-1]} ${k.slice(0,4)}</b><small>Gain ${f(m.g)} · Repa. ${f(m.r)}</small><small>Benefis ${f(m.b)} · Pèt ${f(m.p)}</small></div><div style="text-align:right"><b class="${cls(bl)}">${f(bl)}</b><small>${bl>=0?"BENEFIS":"PÈT"}</small></div></div>`}).join(""):"<p>Pa gen done ankò.</p>";
 // dashboard
 let tg=0,tr=0,tb=0,tp=0;E.forEach(e=>{const v=net(e);if(e.g>0)tg+=e.g;tr+=e.r;if(v>0)tb+=v;else tp-=v});
 const kv=[["TOTAL GAIN",tg],["TOTAL REPARASYON",tr],["TOTAL BENEFIS",tb],["TOTAL PÈT",tp]];
 $("kp").innerHTML=kv.map(x=>`<div class="kp">${x[0]}<span>${f(x[1])}</span></div>`).join("")+`<div class="kp big">BILAN JENERAL<span class="${cls(tb-tp)}">${f(tb-tp)}</span></div>`;
 const ys=[...new Set(E.map(e=>e.d.slice(0,4)).concat([today().slice(0,4)]))].sort();
 const cur=$("yr").value||today().slice(0,4);
 $("yr").innerHTML=ys.map(y=>`<option${y===cur?" selected":""}>${y}</option>`).join("");
 chart($("yr").value);
}
function chart(y){
 const b=Array(12).fill(0);E.forEach(e=>{if(e.d.slice(0,4)===y)b[+e.d.slice(5,7)-1]+=net(e)});
 const mx=Math.max(1,...b.map(Math.abs)),W=340,H=200,z=H/2,bw=18;
 let s=`<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="Bilan chak mwa"><line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="#9DB0E0"/>`;
 b.forEach((v,i)=>{const h=Math.abs(v)/mx*(z-14),x=8+i*28;
  s+=`<rect x="${x}" y="${v>=0?z-h:z}" width="${bw}" height="${h}" rx="3" fill="${v>=0?"#2F5FD0":"#C00000"}"/><text x="${x+bw/2}" y="${H+14}" font-size="9" text-anchor="middle" fill="currentColor">${MO[i].slice(0,3)}</text>`});
 $("ch").innerHTML=s+"</svg><div class='hint'>Ble = benefis · Wouj = pèt (bilan mwa a)</div>"}
$("yr").onchange=()=>chart($("yr").value);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
 ["p1","p2","p3"].forEach(p=>$(p).classList.toggle("hide",p!==b.dataset.p));scrollTo(0,0)});
// CSV export / import
$("ex").onclick=async()=>{
 const S=[...E].sort((a,b)=>a.d<b.d?-1:1);let c=0;
 const rows=["Dat,Gain / Pèt,Reparasyon,Gain net / Pèt net,Montan an (Gdes)"].concat(S.map(e=>{c+=net(e);return [e.d,e.g,e.r,net(e),c].join(",")}));
 try{const u=URL.createObjectURL(new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv"})),l=document.createElement("a");l.href=u;l.download="PLAN_DE_DIEU_CENTER_kopi.csv";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){alert("Pa t kapab telechaje fichye a.")}};
$("im").onclick=()=>$("fi").click();
$("fi").onchange=async()=>{
 const t=await $("fi").files[0].text();const L=t.replace(/^\ufeff/,"").split(/\r?\n/).slice(1);let a=0;
 L.forEach(l=>{const p=l.split(",");if(/^\d{4}-\d{2}-\d{2}$/.test(p[0])&&!E.some(e=>e.d===p[0]&&e.g===n(p[1])&&e.r===n(p[2]))){E.push({id:Date.now()+Math.random(),d:p[0],g:n(p[1]),r:n(p[2])});a++}});
 save();render();alert(a+" antre ajoute.");$("fi").value=""};
reset();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
